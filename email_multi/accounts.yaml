# Email accounts for email-multi plugin
# Copy to ~/.hermes/plugins/email_multi/accounts.yaml and customize.
#
# IMPORTANT: Use password_env to reference environment variables.
# Plaintext passwords are rejected.

accounts:
  - account_id: gmail
    email: your-email@gmail.com
    display_name: Gmail
    password_env: EMAIL_GMAIL_PASSWORD
    imap_host: imap.gmail.com
    imap_port: 993
    smtp_host: smtp.gmail.com
    smtp_port: 587
    allowed_users:
      - your-email@gmail.com
    allow_all: false
    skip_attachments: false
    folders:
      inbox: INBOX
      sent: "[Gmail]/Sent Mail"
      drafts: "[Gmail]/Drafts"
      trash: "[Gmail]/Trash"
